org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# The site the app opens. Override on the command line to build against another
# deployment without editing a file that is under version control:
#   ./gradlew assembleDebug -PrelayHost=staging.relaaay.online
relayHost=relaaay.online

# Signing. Left empty so a fresh clone builds without any local setup; set these
# (or the matching RELAY_KEYSTORE / RELAY_KEYSTORE_PASSWORD / RELAY_KEY_ALIAS /
# RELAY_KEY_PASSWORD environment variables) to produce an installable release
# build. See android/README.md.
relayKeystore=
relayKeystorePassword=
relayKeyAlias=
relayKeyPassword=
