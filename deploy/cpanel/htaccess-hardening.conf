# Relay — Apache hardening for cPanel / Passenger
#
# APPEND the contents of this file to the .htaccess in your public_html.
# Do not replace that file: cPanel writes the PassengerAppRoot / PassengerBaseURI
# block into it when you create the Node.js app, and removing those lines takes
# the site offline.
#
# The blocks below matter most when the application files live inside
# public_html. Apache can serve a file that physically exists in the document
# root before Passenger ever sees the request, which would publish the SQLite
# database and every uploaded attachment to anyone who guesses the path.

# ---------------------------------------------------------------------------
# 1. Never serve application internals.
#    404 rather than 403, so the response does not confirm that a path exists.
# ---------------------------------------------------------------------------
RedirectMatch 404 ^/(data|server|test|deploy|node_modules|tmp)(/|$)
RedirectMatch 404 ^/\.(git|github|env)(/|$)

<FilesMatch "\.(db|db-wal|db-shm|sqlite|sqlite3|log|md|yml|yaml)$">
  Require all denied
</FilesMatch>

<FilesMatch "^(package\.json|package-lock\.json|app\.js|\.gitignore|\.env.*)$">
  Require all denied
</FilesMatch>

# ---------------------------------------------------------------------------
# 2. Let Server-Sent Events through unbuffered.
#    Relay pushes live updates over text/event-stream. If the web server holds
#    the response in a buffer, messages arrive in batches or not at all.
# ---------------------------------------------------------------------------
<IfModule mod_passenger.c>
  PassengerBufferResponse off
</IfModule>

# LiteSpeed / OpenLiteSpeed honour this instead.
<IfModule LiteSpeed>
  SetEnv noabort 1
  SetEnv no-gzip 1
</IfModule>

# mod_deflate would buffer the stream; exclude event-streams from compression.
<IfModule mod_env.c>
  SetEnvIfNoCase Accept text/event-stream no-gzip=1
</IfModule>

# ---------------------------------------------------------------------------
# 3. Allow attachment uploads.
#    Relay caps files at 10 MB; give Apache a little headroom above that.
#    Remove this block if your host disallows LimitRequestBody in .htaccess.
# ---------------------------------------------------------------------------
LimitRequestBody 12582912

# ---------------------------------------------------------------------------
# 4. Force HTTPS.
#    Passkeys require a secure context, and the session cookie is only marked
#    Secure when you set RELAY_SECURE=1 — which assumes HTTPS is enforced here.
# ---------------------------------------------------------------------------
<IfModule mod_rewrite.c>
  RewriteEngine On
  RewriteCond %{HTTPS} !=on
  RewriteCond %{HTTP:X-Forwarded-Proto} !https
  RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</IfModule>
