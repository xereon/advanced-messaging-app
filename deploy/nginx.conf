# nginx reverse proxy for Relay.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/relay
#   sudo ln -s /etc/nginx/sites-available/relay /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Get the certificate first:  sudo certbot --nginx -d relay.example.com

upstream relay_app {
    server 127.0.0.1:8130;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name relay.example.com;

    # Everything else is served over TLS; the session cookie is Secure.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name relay.example.com;

    ssl_certificate     /etc/letsencrypt/live/relay.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Attachments are capped at 10 MB by the app; leave headroom for overhead.
    client_max_body_size 12m;

    # Relay sets its own X-Frame-Options, Referrer-Policy and
    # X-Content-Type-Options, so nothing is duplicated here.

    location / {
        proxy_pass http://relay_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Empty Connection header keeps the upstream connection alive.
        proxy_set_header Connection        "";
    }

    # The live stream is a long-lived Server-Sent Events response. Buffering it
    # is the single most common reason a deployment "works" but never updates:
    # nginx holds the events and the client sees nothing until the buffer fills.
    location /api/events {
        proxy_pass http://relay_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        # The server sends a heartbeat every 25s; allow generously more.
        proxy_read_timeout 1h;
        send_timeout 1h;
    }
}
