name: Android

# Builds the Trusted Web Activity wrapper in android/ and leaves the APK on the
# run as a downloadable artifact, so installing Relay on a phone never needs
# Android Studio — only a browser and `adb install`.

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # The runner image ships the Android SDK, so there is nothing to install.
      # This only fails loudly if that ever stops being true.
      - name: Locate the Android SDK
        run: |
          test -d "$ANDROID_HOME" || { echo "no Android SDK on this runner" >&2; exit 1; }
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Build the debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      # A release build needs a signing key, which only exists if the repository
      # owner has added one. Without it the debug APK is still built and still
      # installs; it just carries a different signature, so the Digital Asset
      # Link will not match and Chrome keeps its address bar.
      - name: Unpack the release signing key
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELAY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/relay-release.jks"
            echo "path=$RUNNER_TEMP/relay-release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "No RELAY_KEYSTORE_BASE64 secret is set — building the debug APK only."
          fi

      - name: Build the release APK
        if: steps.keystore.outputs.path != ''
        working-directory: android
        env:
          RELAY_KEYSTORE: ${{ steps.keystore.outputs.path }}
          RELAY_KEYSTORE_PASSWORD: ${{ secrets.RELAY_KEYSTORE_PASSWORD }}
          RELAY_KEY_ALIAS: ${{ secrets.RELAY_KEY_ALIAS }}
          RELAY_KEY_PASSWORD: ${{ secrets.RELAY_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      # The half of the Digital Asset Link that lives on the site has to name
      # the key the half in the APK was signed with. Nothing on the device says
      # when they disagree — the address bar just stays — so it is checked here.
      - name: Check the site trusts this signing key
        if: steps.keystore.outputs.path != ''
        env:
          RELAY_KEYSTORE_PASSWORD: ${{ secrets.RELAY_KEYSTORE_PASSWORD }}
        run: |
          node scripts/assetlinks.js --check \
            --keystore "${{ steps.keystore.outputs.path }}" \
            --alias "${{ secrets.RELAY_KEY_ALIAS }}"

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/relay-release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: relay-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
